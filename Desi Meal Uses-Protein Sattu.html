<h2>Choose who it is for</h2><div class="tiles">${G.map((g,i)=>`<button class="tile" style="--c:${g.c}" onclick="go('${g.id}')"><i>${i+1}</i><b>${g.n}</b><span>${g.tag}</span></button>`).join('')}<button class="tile" style="--c:#16301A" onclick="go('safety')"><i>!</i><b>Safety and Notes</b><span>Allergens, how to start</span></button></div>
<h2>The 3 basics everyone can start with</h2><div class="basics"><div class="box"><b>1. Sattu sharbat</b><br>2-3 tbsp in a glass of water or buttermilk. Add roasted cumin, black salt and lemon.</div><div class="box"><b>2. Warm porridge</b><br>Whisk into warm milk or water with a touch of jaggery or honey.</div><div class="box"><b>3. Nutrition booster</b><br>Add 2 tbsp to atta dough for rotis, or stir into dals and gravies.</div></div>`}
function group(g){const t=tried(g);let h=`<div class="gh"><h1>${g.n}</h1><p>${g.tag}</p><div class="prog"><i id="pb" style="width:${t/g.cards.length*100}%"></i></div><small id="pt">${t} of ${g.cards.length} recipes tried</small></div><div class="dose"><b>DAILY AMOUNT</b>${g.dose}</div>`;
h+=g.cards.map((c,i)=>`<div class="card${st[g.id+i]?' done':''}${i==0?' open':''}"><div class="ch" onclick="this.parentNode.classList.toggle('open')"><span class="tag">${c[0]}</span><h3>${c[1]}</h3><label class="cb" onclick="event.stopPropagation()"><input type="checkbox" ${st[g.id+i]?'checked':''} onchange="tick('${g.id}',${i},this)">Tried it</label><span class="chev">&gt;</span></div><div class="cbody"><p><b>How:</b> ${c[2]}</p><p class="why"><b>Why it works:</b> ${c[3]}</p></div></div>`).join('');
h+=`<div class="tip"><b>${g.tip[0].toUpperCase()}</b>${g.tip[1]}</div>`;
if(g.id=='family')h+=`<h2>Atta mix ratio calculator</h2><div class="box"><div class="calc"><label>Cups of atta: <input id="at" type="number" min="1" value="4" oninput="rat()"></label></div><table><tr><th>Use</th><th>Ratio (Desi Meal : atta)</th><th>Desi Meal needed</th></tr>${[['Family kitchen',1,4,'kids'],['Women\'s wellness',1,2,'women'],['Muscle meals',2,1,'gym']].map(r=>`<tr class="l" onclick="go('${r[3]}')"><td>${r[0]} &gt;</td><td>${r[1]} : ${r[2]}</td><td class="rr" data-a="${r[1]}" data-b="${r[2]}"></td></tr>`).join('')}</table><p><small>Everyday booster: just 2 tbsp per dough. Tap a row to see that group's page.</small></p></div>`;
return h+pn(g.id)}
function safety(){return `<div class="gh" style="--c:#16301A"><h1>Safety and Notes</h1><p>Please read before you start</p></div>`+[['Allergen note','Desi Meal contains soy and chickpea. Anyone with a known allergy to either should avoid it. When introducing it to a toddler, watch closely for rashes, hives or tummy distress over the first few servings.'],['Start small','Begin with the lower amount shown for each age group and increase gradually.'],['Toddlers','Start with 1 tsp a day and build up to 1-2 tsp. Cool all hot food completely, keep ladoos soft and always supervise eating. Check with your paediatrician before starting.'],['Not a medicine','Desi Meal is a food, not a treatment or cure. If you manage a health condition, are pregnant or breastfeeding, or take medication, check with your doctor first and use it as part of a balanced diet.'],['Honey','Do not give honey to children under 1 year. Use jaggery or mashed banana instead.']].map(x=>`<div class="card" style="--c:#E8A317"><h3>${x[0]}</h3><p>${x[1]}</p></div>`).join('')+contact+pn('safety')}
function rat(){const a=+$('#at').value||0;document.querySelectorAll('.rr').forEach(e=>{const v=a*e.dataset.a/e.dataset.b;e.textContent=(Math.round(v*100)/100)+' cup'+(v==1?'':'s')})}
function tick(id,i,el){st[id+i]=el.checked;save();el.closest('.card').classList.toggle('done',el.checked);const g=G.find(x=>x.id==id),t=tried(g);$('#pb').style.width=t/g.cards.length*100+'%';$('#pt').textContent=t+' of '+g.cards.length+' recipes tried'}
